<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <style>
        body{
            font-family:'Courier New', Courier, monospace;
            background: #fff;
            color: #111;
            padding: 20px;
        }
        .stage{
            display: flex; gap: 20px; flex-wrap: wrap;
        }
        canvas{
            background: #f4f4f4; 
            border: 1px solid #ccc; 
        }
        .controls{
                margin-top: 20px;
                display: flex;
                gap:20px;
                align-items: center;
        }
    </style>
</head>
<body>
    <h2> fourier</h2>
    <div class = "stage">
        <canvas id="drawCanvas" width="400" height="400"></canvas>
        <canvas id="displayCanvas" width="400" height="400"></canvas>
    </div>
    <div class = "controls">
        <label> Harmonics: <span id = "hVal"></span> <input type = "range" id = "hSlider"></label> 
        <button id = "pauseButton">Pause</button>
        <button id = "resetButton">Reset</button>
    </div>
</body>

<script src="fourier.js"></script>
</html>
